# ============================================================
# Freelancer Invoice & Client Management System - Backend
# ============================================================

server.port=8080

# H2 In-Memory Database (No MySQL install needed)
spring.datasource.url=jdbc:h2:mem:freelancerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin123

# H2 Console - view DB at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Settings
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# IMPORTANT: Run data.sql AFTER JPA creates tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT
app.jwt.secret=freelancer-secret-key-2024-very-long-secure-string-do-not-share
app.jwt.expiration=86400000

# Logging
logging.level.com.freelancer=DEBUG
logging.level.org.springframework.security=WARN
